<div id="aura"><i></i><i></i><i></i></div>
<div id="grain"></div>

<div id="gate"><div class="box"><div class="spinner"></div><h1>Joining</h1><p>Connecting to the voice chat…</p></div></div>

<main id="room" hidden>
  <header class="top">
    <button class="icon-btn" id="b-admin" aria-label="Menu"><svg class="ico"><use href="#i-more"/></svg><span class="badge" id="admin-badge" hidden></span></button>
    <div class="t">
      <h1 id="r-title">Voice Chat</h1>
      <div class="sub"><span class="live-dot"></span><span id="r-count">0 listening</span><span id="r-rec" class="rec" hidden>REC</span><span id="r-lock" hidden>🔒</span></div>
    </div>
    <button class="icon-btn" id="b-search" aria-label="Search music"><svg class="ico"><use href="#i-music"/></svg></button>
  </header>
  <div class="desc" id="r-desc" hidden></div>
  <div class="scroll" id="scroll">
    <div class="np-card empty" id="np-card"></div>
    <div class="stage" id="stage"></div>
    <div class="list-h"><span id="lh-count">Participants</span></div>
    <div class="plist" id="grid"></div>
  </div>
  <div id="chat-pop" aria-live="polite"></div>
  <div id="fly-layer" aria-hidden="true"></div>
  <div class="chatbar">
    <button class="cb-btn" id="b-history" aria-label="Chat history"><svg class="ico"><use href="#i-chat"/></svg><span class="badge" id="chat-badge" hidden></span></button>
    <input id="cb-input" type="text" maxlength="1000" placeholder="Message" enterkeyhint="send" autocomplete="off" aria-label="Message">
    <button class="cb-btn" id="b-react" aria-label="Reactions"><svg class="ico"><use href="#i-smile"/></svg></button>
    <button class="cb-btn send" id="b-send" aria-label="Send" hidden><svg class="ico"><use href="#i-send"/></svg></button>
    <div id="react-bar" hidden></div>
  </div>
  <nav class="dock">
    <button class="dk" id="b-cam"><span class="c"><svg class="ico"><use href="#i-video-off"/></svg></span><span>Video</span></button>
    <button class="dk" id="b-more"><span class="c"><svg class="ico"><use href="#i-more"/></svg></span><span>More</span></button>
    <div class="mic-wrap"><button class="mic wait" id="b-mic" aria-label="Microphone"><span class="halo"></span><span class="blob"></span><svg class="ico"><use href="#i-mic-off"/></svg></button><div class="mic-lbl" id="mic-lbl">Connecting</div></div>
    <button class="dk" id="b-speaker"><span class="c"><svg class="ico"><use href="#i-speaker"/></svg></span><span>Audio</span></button>
    <button class="dk red" id="b-leave"><span class="c"><svg class="ico"><use href="#i-leave"/></svg></span><span>Leave</span></button>
  </nav>
</main>

<div id="toasts"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
